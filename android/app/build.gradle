apply plugin: 'com.android.application'

def jp2CreationKeystorePath = System.getenv("JP2_CREATION_ANDROID_KEYSTORE_PATH")
def hasJp2CreationReleaseSigning = jp2CreationKeystorePath != null && jp2CreationKeystorePath.trim()
def jp2HubUrl = (System.getenv("JP2_HUB_ANDROID_URL") ?: "").trim()

if (!jp2HubUrl) {
    jp2HubUrl = "about:blank"
}

def escapedJp2HubUrl = jp2HubUrl.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace = "fr.jp2creation.hub"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            if (hasJp2CreationReleaseSigning) {
                storeFile file(jp2CreationKeystorePath)
                storeType "pkcs12"
                storePassword System.getenv("JP2_CREATION_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("JP2_CREATION_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("JP2_CREATION_ANDROID_KEY_PASSWORD")
            }
        }
    }
    defaultConfig {
        applicationId "fr.jp2creation.hub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 57
        versionName "1.55"
        buildConfigField "String", "HUB_URL", "\"${escapedJp2HubUrl}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasJp2CreationReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
